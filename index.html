<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wörter</title>
<meta name="description" content="German vocabulary trainer with spaced repetition, built on a CSV word list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E5E9EE; --desk-2:#D8DEE6; --card:#FFFFFF; --card-2:#F6F8FA;
  --ink:#1B2430; --ink-2:#465263; --ink-3:#6E7A89;
  --rule:#E4EDF6; --margin:#E05A5F; --line:#C9D1DB;
  --der:#2853B8; --die:#BE3A2E; --das:#1F7F52;
  --der-bg:#E6EDFB; --die-bg:#FBE9E7; --das-bg:#E3F3EA;
  --accent:#1E3A5C; --accent-ink:#FFFFFF; --accent-soft:#E2E9F2;
  --focus:#2853B8;
  --shadow:0 1px 0 rgba(27,36,48,.06), 0 18px 40px -24px rgba(27,36,48,.45);
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#12171E; --desk-2:#1A212B; --card:#1E2631; --card-2:#252E3A;
    --ink:#E7ECF2; --ink-2:#B3BDC9; --ink-3:#8793A1;
    --rule:#28333F; --margin:#B5484D; --line:#344050;
    --der:#7FA5F5; --die:#F28B7E; --das:#5FCB95;
    --der-bg:#1F2C47; --die-bg:#3D2422; --das-bg:#18352A;
    --accent:#A9C4EA; --accent-ink:#0F1823; --accent-soft:#263346;
    --focus:#7FA5F5;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --desk:#12171E; --desk-2:#1A212B; --card:#1E2631; --card-2:#252E3A;
  --ink:#E7ECF2; --ink-2:#B3BDC9; --ink-3:#8793A1;
  --rule:#28333F; --margin:#B5484D; --line:#344050;
  --der:#7FA5F5; --die:#F28B7E; --das:#5FCB95;
  --der-bg:#1F2C47; --die-bg:#3D2422; --das-bg:#18352A;
  --accent:#A9C4EA; --accent-ink:#0F1823; --accent-soft:#263346;
  --focus:#7FA5F5;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* Header */
header.top{padding:20px 0 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1;margin:0;letter-spacing:-.01em}
.brand .meta{color:var(--ink-3);font-size:14px}
nav.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs button .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px;text-align:center}
main{padding:20px 0 64px}
section[hidden]{display:none}

/* Session bar */
.session-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:inline-flex;background:var(--desk-2);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--ink-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.filters{display:flex;gap:8px}
select.sm{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:14px;max-width:150px}
.progress-line{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:14px;margin-bottom:10px}
.progress-line .bar{flex:1;height:4px;background:var(--desk-2);border-radius:2px;overflow:hidden}
.progress-line .bar i{display:block;height:100%;background:var(--ink-2);width:0;transition:width .25s}

/* The index card */
.card{position:relative;background:var(--card);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px 10px;border-bottom:2px solid var(--margin);min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:6px;width:36px;height:32px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.icon-btn svg{width:18px;height:18px}
.card-body{padding:18px 22px 22px;background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);background-position:0 17px;min-height:260px}
.prompt-lang{font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
.headword{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;font-family:var(--serif);font-size:clamp(34px,7vw,48px);line-height:1.2;font-weight:600;margin:6px 0 4px;word-break:break-word}
.headword .w{letter-spacing:-.01em}
.prompt{font-family:var(--serif);font-size:clamp(26px,5.5vw,36px);line-height:1.25;font-weight:400;margin:6px 0 4px}

/* Artikel stamp */
.art{font-family:var(--sans);font-size:.5em;font-weight:700;align-self:center;border-radius:6px;min-width:2.9em;height:1.7em;padding:0 .5em;display:inline-grid;place-items:center;border:2px dashed var(--ink-3);color:var(--ink-3);background:transparent;letter-spacing:.02em}
.art:hover{border-color:var(--ink-2);color:var(--ink-2)}
.art.shown{border-style:solid;cursor:default}
.art.der{color:var(--der);border-color:var(--der);background:var(--der-bg)}
.art.die{color:var(--die);border-color:var(--die);background:var(--die-bg)}
.art.das{color:var(--das);border-color:var(--das);background:var(--das-bg)}
.art.stamp{animation:stamp .28s cubic-bezier(.2,.9,.3,1.3)}
@keyframes stamp{from{transform:scale(1.35) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.guess{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap;align-items:center}
.guess .lbl{font-size:13px;color:var(--ink-3);margin-right:2px}
.guess button{border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:4px 14px;font-weight:700;font-size:15px}
.guess button.g-der{color:var(--der)} .guess button.g-die{color:var(--die)} .guess button.g-das{color:var(--das)}
.guess button.g-der:hover{border-color:var(--der)} .guess button.g-die:hover{border-color:var(--die)} .guess button.g-das:hover{border-color:var(--das)}
.guess button:disabled{opacity:.35;cursor:default}
.guess button.picked{opacity:1;border-color:currentColor}
.verdict{font-size:14px;font-weight:700}
.verdict.ok{color:var(--das)} .verdict.no{color:var(--die)}

/* Back of card */
.back{margin-top:14px;padding-top:8px;border-top:1px dashed var(--line)}
.meanings{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:baseline;font-size:19px;line-height:32px}
.meanings dt{font-size:12.5px;color:var(--ink-3);font-weight:700}
.meanings dd{margin:0}
.forms{color:var(--ink-2);font-size:15.5px;line-height:32px}
.forms b{color:var(--ink);font-weight:700}
.example{margin-top:8px;border-left:3px solid var(--line);padding:0 0 0 12px;line-height:32px}
.example .de{font-family:var(--serif);font-size:19px;line-height:32px}
.example .tr-en{color:var(--ink-3);font-size:14.5px;line-height:32px}
.front-example{font-family:var(--serif);font-size:18px;color:var(--ink-2);margin-top:10px}

.conj{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));column-gap:36px;margin:2px 0 0;line-height:32px;font-size:17px}
.conj .pr{color:var(--ink-3);font-size:14px;display:inline-block;min-width:5.2em}
.conj b{font-family:var(--serif);font-weight:600}
@media (max-width:420px){.conj{column-gap:14px;font-size:16px}.conj .pr{min-width:5em;font-size:13px}}
/* Answer buttons */
.answer{margin-top:16px}
.reveal-btn{width:100%;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:14px;font-weight:700;font-size:17px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:10px 6px;text-align:center;line-height:1.25}
.grades button b{display:block;font-size:16px}
.grades button span{font-size:13px;color:var(--ink-3)}
.grades .forgot b{color:var(--die)} .grades .forgot:hover{border-color:var(--die)}
.grades .hard b{color:var(--ink-2)} .grades .hard:hover{border-color:var(--ink-3)}
.grades .good b{color:var(--das)} .grades .good:hover{border-color:var(--das)}
.next-btn{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:12px;font-weight:700}
.keys{margin-top:10px;font-size:12.5px;color:var(--ink-3);text-align:center}
kbd{font-family:var(--sans);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}
@media (hover:none){.keys{display:none}}

/* Leitner dividers — the tier picker */
.dividers{margin-top:22px}
.dividers .cap{font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.divider-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;align-items:end}
.divider-row button{border:1px solid var(--line);border-bottom:0;background:var(--desk-2);color:var(--ink-2);border-radius:8px 8px 0 0;padding:8px 2px 6px;font-size:13px;font-weight:700;line-height:1.15}
.divider-row button small{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
.divider-row button:nth-child(1){min-height:44px} .divider-row button:nth-child(2){min-height:48px} .divider-row button:nth-child(3){min-height:52px}
.divider-row button:nth-child(4){min-height:56px} .divider-row button:nth-child(5){min-height:60px} .divider-row button:nth-child(6){min-height:64px} .divider-row button:nth-child(7){min-height:68px}
.divider-row button:hover{background:var(--card);color:var(--ink)}
.divider-row button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.divider-base{height:6px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px}


@media (max-width:560px){
  nav.tabs button{padding:10px 9px;font-size:15px}
  .divider-row{grid-template-columns:repeat(4,1fr);gap:6px}
  .divider-row button,.divider-row button:nth-child(n){min-height:50px;border:1px solid var(--line);border-radius:8px}
  .divider-base{display:none}
}

/* Empty / done states */
.state{background:var(--card);border-radius:6px;box-shadow:var(--shadow);padding:28px 24px;text-align:left}
.state h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 6px}
.state p{margin:6px 0;color:var(--ink-2);max-width:60ch}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--die)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Words list */
.list-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.list-tools input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.tier-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tier-chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13.5px;color:var(--ink-2)}
.tier-chips button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.wlist{background:var(--card);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.wrow{border-bottom:1px solid var(--rule)}
.wrow:last-child{border-bottom:0}
.wrow-main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:10px 14px}
.wrow-main .de{font-family:var(--serif);font-size:18px;font-weight:600;background:none;border:0;text-align:left;padding:0}
.wrow-main .de .a{font-family:var(--sans);font-size:13px;font-weight:700;margin-right:6px}
.a.der{color:var(--der)} .a.die{color:var(--die)} .a.das{color:var(--das)}
.wrow-main .mean{color:var(--ink-2);font-size:14.5px;min-width:0}
.wrow-main .mean span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow-main .ctl{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wrow-main .due{font-size:12px;color:var(--ink-3)}
.wrow-detail{padding:0 14px 14px;color:var(--ink-2);font-size:15px}
.wrow-detail .de-ex{font-family:var(--serif);color:var(--ink);font-size:17px}
@media (max-width:560px){
  .wrow-main{grid-template-columns:minmax(0,1fr) auto}
  .wrow-main .mean{grid-column:1/-1;grid-row:2}
}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:6px;box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:600}
.stat span{font-size:13.5px;color:var(--ink-2)}
@media (max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.panel{background:var(--card);border-radius:6px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
.panel h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 4px}
.panel .sub{color:var(--ink-3);font-size:14px;margin:0 0 14px}
.boxes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:170px}
.box{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.box .fill{width:100%;background:var(--accent-soft);border:1px solid var(--line);border-bottom:2px solid var(--ink-2);border-radius:4px 4px 0 0;min-height:4px;position:relative}
.box .cnt{font-weight:700;font-size:15px;margin-bottom:4px}
.box .lab{font-size:12px;color:var(--ink-3);margin-top:6px;text-align:center;line-height:1.2}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;justify-content:start;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:2px;background:var(--desk-2);display:block}
.heat i.l1{background:color-mix(in srgb, var(--das) 30%, var(--desk-2))}
.heat i.l2{background:color-mix(in srgb, var(--das) 55%, var(--desk-2))}
.heat i.l3{background:color-mix(in srgb, var(--das) 78%, var(--desk-2))}
.heat i.l4{background:var(--das)}
.heat i.future{background:transparent}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.art-acc{display:flex;gap:18px;flex-wrap:wrap}
.art-acc div{min-width:90px}
.art-acc b{font-family:var(--serif);font-size:24px;font-weight:600;display:block}

/* Settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.set-row:first-of-type{border-top:0}
.set-row label,.set-row .l{font-weight:700}
.set-row .hint{display:block;font-weight:400;font-size:13.5px;color:var(--ink-3)}
.set-row input[type=number]{width:76px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:right}
.set-row select{background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.set-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.interval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.interval-grid label{display:flex;flex-direction:column;font-size:13.5px;color:var(--ink-2);gap:4px}
.interval-grid input{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
@media (max-width:480px){.interval-grid{grid-template-columns:repeat(2,1fr)}}
.source-info{font-size:14px;color:var(--ink-2)}
.source-info code{background:var(--card-2);padding:1px 5px;border-radius:4px;font-size:13px}

/* Toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:14.5px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{color:var(--ink-3);font-size:13px;padding:0 0 30px}
footer a{color:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Wörter</h1>
      <span class="meta" id="meta">Loading words…</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-view="review" aria-selected="true">Review <span class="n" id="due-badge" hidden>0</span></button>
      <button role="tab" data-view="words" aria-selected="false">Words</button>
      <button role="tab" data-view="stats" aria-selected="false">Progress</button>
      <button role="tab" data-view="settings" aria-selected="false">Settings</button>
    </nav>
  </header>

  <main>
    <section id="v-review"></section>
    <section id="v-words" hidden></section>
    <section id="v-stats" hidden></section>
    <section id="v-settings" hidden></section>
  </main>
  <footer>Word list: <span id="foot-src">—</span>. Your review progress is saved in this browser only; use Settings → Back up progress to move it.</footer>
</div>
<input type="file" id="file-words" accept=".csv,.json,text/csv,application/json" hidden>
<input type="file" id="file-progress" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Tiers ---------- */
const TIERS = [
  {id:'daily',     label:'Daily',          short:'1 d'},
  {id:'bidaily',   label:'Every 2 days',   short:'2 d'},
  {id:'weekly',    label:'Weekly',         short:'1 wk'},
  {id:'biweekly',  label:'Every 2 weeks',  short:'2 wk'},
  {id:'monthly',   label:'Monthly',        short:'1 mo'},
  {id:'quarterly', label:'Every 3 months', short:'3 mo'},
  {id:'retired',   label:'Retired',        short:'done'},
];
const TIER_IDS = TIERS.map(t => t.id);
const ACTIVE = TIER_IDS.filter(t => t !== 'retired');
const TIER_NAME = Object.fromEntries(TIERS.map(t => [t.id, t.label]));
const TIER_TAB = {daily:'Daily', bidaily:'2 days', weekly:'Weekly', biweekly:'2 weeks', monthly:'Monthly', quarterly:'3 months', retired:'Retired'};
const TIER_ALIASES = {
  'day':'daily','1d':'daily','1':'daily','gunluk':'daily','günlük':'daily','täglich':'daily',
  'bi-daily':'bidaily','bi_daily':'bidaily','2d':'bidaily','2-days':'bidaily','every-2-days':'bidaily','2':'bidaily',

/* ---------- Dates ---------- */

const ivl = tier => store.settings.intervals[tier] || DEFAULTS.intervals[tier] || 1;

/* ---------- Words: parsing ---------- */
const COLS = ['date','german','artikel','forms','type','english','turkish','example_de','example_en','example_tr','level','tags','repetition'];
const COL_ALIASES = {
  'datum':'date','tarih':'date','added':'date','date_added':'date',
  'word':'german','wort':'german','deutsch':'german','almanca':'german','de':'german',
  'article':'artikel','artikel':'artikel',
  'plural':'forms','cogul':'forms','çoğul':'forms','form':'forms','forms':'forms',
  'pos':'type','wortart':'type','tur':'type','tür':'type','kind':'type',
  'en':'english','ingilizce':'english','englisch':'english',
  'tr':'turkish','turkce':'turkish','türkçe':'turkish','türkisch':'turkish',

    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }

  if (['-','–','—','none','yok','0'].includes(w.artikel)) w.artikel = '';

  if (!w.artikel && (w.type === 'noun' || w.type === 'n')){

/* ---------- Words: loading ---------- */
let WORDS = [], BYKEY = new Map(), SOURCE = {name:'', kind:'', skipped:0, dupes:0, cached:false};
const NAMES = {
  csv:  ['Wörter.csv', 'Wörter.csv'.normalize('NFD'), 'wörter.csv', 'Woerter.csv', 'woerter.csv', 'words.csv'],
  json: ['Wörter.json', 'Wörter.json'.normalize('NFD'), 'wörter.json', 'Woerter.json', 'woerter.json', 'words.json']
};
async function fetchFirst(names){
  for (const n of [...new Set(names)]){
    try {
      const r = await fetch(encodeURIComponent(n) + '?t=' + Date.now(), {cache:'no-store'});
      if (r.ok){ const text = await r.text(); if (text.trim()) return {name:n.normalize('NFC'), text}; }
    } catch(e) {}
  }
  return null;
}
function ingest(text, kind, name, cached){
  const raw = kind === 'json' ? fromJSON(text) : fromCSV(text);
  const list = [], seen = new Set(); let skipped = 0, dupes = 0;
  for (const o of raw){
    const w = cleanWord(o);
    if (!w){ skipped++; continue; }
    if (seen.has(w.key)){ dupes++; continue; }
    seen.add(w.key); list.push(w);
  }
  if (!list.length) throw new Error('No words found in ' + name);
  WORDS = list; BYKEY = new Map(list.map(w => [w.key, w]));
  SOURCE = {name, kind, skipped, dupes, cached:!!cached};
  syncFileTiers();
}
async function loadWords(){
  const order = store.settings.source === 'json' ? ['json','csv'] : ['csv','json'];
  for (const kind of order){
    const got = await fetchFirst(NAMES[kind]);
    if (!got) continue;
    try {
      ingest(got.text, kind, got.name, false);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({text:got.text, kind, name:got.name})); } catch(e) {}
      return true;
    } catch(e){ console.warn(e); toast(e.message); }
  }
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && c.text){ ingest(c.text, c.kind, c.name, true); return true; }
  } catch(e) {}
  return false;
}
/* If the repetition column in the file changes, that change wins. */
function syncFileTiers(){
  let changed = 0;
  for (const w of WORDS){
    const p = store.progress[w.key];
    if (p && p.fileTier !== w.fileTier){
      p.fileTier = w.fileTier; p.tier = w.fileTier;
      p.due = w.fileTier === 'retired' ? null : today();
      changed++;
    }
  }
  if (changed) save();
}

/* ---------- Scheduling ---------- */
const prog = w => store.progress[w.key];
const tierOf = w => (prog(w) ? prog(w).tier : w.fileTier);
const isNew = w => !prog(w);
function ensure(w){
  let p = prog(w);
  if (!p){
    p = store.progress[w.key] = {tier:w.fileTier, fileTier:w.fileTier, due:null, reps:0, lapses:0, last:null};
    const t = today();
    if (store.newToday.date !== t) store.newToday = {date:t, count:0};
    store.newToday.count++;
  }
  return p;
}
function setTier(p, tier){ p.tier = tier; p.due = tier === 'retired' ? null : addDays(today(), ivl(tier)); }
function newLeft(){
  const t = today();
  const used = store.newToday.date === t ? store.newToday.count : 0;
  return Math.max(0, store.settings.newPerDay - used);
}
function dueWords(filter){
  const t = today();
  return WORDS.filter(w => { const p = prog(w); return p && p.tier !== 'retired' && p.due && p.due <= t && (!filter || filter(w)); })
              .sort((a, b) => prog(a).due.localeCompare(prog(b).due) || ACTIVE.indexOf(prog(a).tier) - ACTIVE.indexOf(prog(b).tier));
}
function newWords(filter){
  return WORDS.filter(w => isNew(w) && w.fileTier !== 'retired' && (!filter || filter(w)))
              .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function nextTier(p, grade){
  const i = ACTIVE.indexOf(p.tier);
  if (grade === 'forgot') return store.settings.onForget === 'reset' ? 'daily' : ACTIVE[Math.max(0, i-1)];
  if (grade === 'good'){
    if (p.tier === 'quarterly' && store.settings.autoRetire) return 'retired';
    return ACTIVE[Math.min(ACTIVE.length-1, i+1)];
  }

}
function logReview(){ const t = today(); store.log[t] = (store.log[t] || 0) + 1; }

/* ---------- Session ---------- */
const S = {view:'review', mode:'due', level:'', tag:'', queue:[], i:0, total:0, graded:new Set(), requeued:new Set(), revealed:false, art:null, dir:'de'};
function sessionFilter(){
  return w => (!S.level || w.level === S.level) && (!S.tag || w.tagList.includes(S.tag));
}
function shuffle(a){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startSession(){
  const f = sessionFilter();
  if (S.mode === 'due') S.queue = [...dueWords(f), ...newWords(f).slice(0, newLeft())];
  else if (S.mode === 'practice') S.queue = shuffle(WORDS.filter(w => tierOf(w) !== 'retired' && f(w)));
  else S.queue = shuffle(WORDS.filter(w => w.artikel && f(w)));

  resetCard();
}
function resetCard(){
  S.revealed = false; S.art = null;

  const w = cur();
  if (w && S.dir === 'en' && !w.english) S.dir = w.turkish ? 'tr' : 'de';
  if (w && S.dir === 'tr' && !w.turkish) S.dir = w.english ? 'en' : 'de';
}
const cur = () => S.queue[S.i];

function grade(g){

    p.reps++; p.last = today();
    logReview(); save();
    S.graded.add(w.key);

    if (before !== p.tier) toast(`${w.german}: ${TIER_NAME[before]} → ${TIER_NAME[p.tier]}`);

let deVoice = null;

const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  } else {
    const text = S.dir === 'en' ? w.english : w.turkish;
    front = `<div class="prompt-lang">${S.dir === 'en' ? 'English' : 'Turkish'} to German</div><div class="prompt" ${S.dir==='tr'?'lang="tr"':''}>${esc(text)}</div>`;
  }
  S.artAnim = !!animateArt;
  const back = S.revealed ? backHTML(w) : '';
  let answer;
  if (S.mode === 'artikel'){
    answer = S.art ? `<button class="next-btn" data-act="next">Next word</button>` : `<button class="reveal-btn" data-act="art-reveal">Show artikel</button>`;
  } else if (!S.revealed){
    answer = `<button class="reveal-btn" data-act="reveal">Show answer</button>`;
  } else {
    const p = prog(w) || {tier:w.fileTier};
    const scheduled = S.mode === 'due' && !S.graded.has(w.key);
    const sub = g => scheduled ? (nextTier(p, g) === 'retired' ? 'retire' : inWords(ivl(nextTier(p, g)))) : (g === 'forgot' ? 'see again' : 'next');
    answer = `<div class="grades">
      <button class="forgot" data-act="grade" data-g="forgot"><b>Forgot</b><span>${sub('forgot')}</span></button>
      <button class="hard" data-act="grade" data-g="hard"><b>Hard</b><span>${sub('hard')}</span></button>
      <button class="good" data-act="grade" data-g="good"><b>Knew it</b><span>${sub('good')}</span></button></div>`;
  }
  const keys = S.mode === 'artikel'
    ? `<kbd>J</kbd> der <kbd>K</kbd> die <kbd>L</kbd> das &nbsp; <kbd>Space</kbd> next`
    : `<kbd>Space</kbd> show <kbd>A</kbd> artikel <kbd>J K L</kbd> der/die/das <kbd>1 2 3</kbd> grade <kbd>S</kbd> listen`;
  const dividers = S.mode === 'artikel' ? '' : `<div class="dividers">
      <div class="cap">Move this word to</div>
      <div class="divider-row">${TIERS.map(t => `<button data-act="tier" data-t="${t.id}" aria-current="${tier===t.id}" title="${esc(t.label)}">${esc(TIER_TAB[t.id])}<small>${t.id==='retired' ? 'never' : esc(inWords(ivl(t.id)).replace('in ', ''))}</small></button>`).join('')}</div>
      <div class="divider-base"></div></div>`;
  el.innerHTML = bar + `
    <div class="progress-line"><span>${Math.min(S.i + 1, S.total)} of ${S.total}</span><span class="bar"><i style="width:${pct}%"></i></span><span>${esc(TIER_NAME[tier])}${prog(w) && prog(w).due && S.mode !== 'due' ? ', ' + esc(dueText(prog(w).due)) : ''}</span></div>
    <article class="card" aria-live="polite">
      <div class="card-head"><div class="chips">${chipsHTML(w)}</div>
        <button class="icon-btn" data-act="speak" aria-label="Listen to pronunciation" title="Listen (S)">${ICON_SPEAK}</button></div>
      <div class="card-body">${front}${back}</div>
    </article>
    <div class="answer">${answer}</div>
    <div class="keys">${keys}</div>
    ${dividers}`;
}
function doneHTML(){
  if (S.mode !== 'due') return `<div class="state"><h2>Round finished</h2><p>You went through every word in this round.</p><div class="btn-row"><button class="btn primary" data-act="restart">Start another round</button></div></div>`;
  const t = today(); const upcoming = WORDS.map(w => prog(w)).filter(p => p && p.due && p.due > t).map(p => p.due).sort();
  let nextLine = 'Add words to Wörter.csv to get more cards.';
  if (upcoming.length){ const d = upcoming[0]; const n = upcoming.filter(x => x === d).length; nextLine = `Next review: ${n} word${n>1?'s':''} ${inWords(diffDays(t, d))}.`; }
  const left = newWords(sessionFilter()).length;
  const extra = left && newLeft() === 0 ? `<p>${left} new word${left>1?'s are':' is'} waiting. You've reached today's limit of ${store.settings.newPerDay} new words; change it in Settings.</p>` : '';
  const reviewed = store.log[t] || 0;
  return `<div class="state"><h2>${reviewed ? 'Done for today' : 'Nothing due right now'}</h2>
    <p>${reviewed ? `You reviewed ${reviewed} card${reviewed>1?'s':''} today. ` : ''}${nextLine}</p>${extra}
    <div class="btn-row"><button class="btn primary" data-mode="practice">Practice anyway</button><button class="btn" data-mode="artikel">Artikel drill</button></div></div>`;
}
function loadErrorHTML(){
  const local = location.protocol === 'file:';
  return `<div class="state"><h2>No word list found</h2>
    <p>The page looks for <b>Wörter.csv</b> (or <b>Wörter.json</b>) in the same folder as index.html.</p>
    ${local ? '<p>You opened the page straight from your computer, and browsers do not let a page read files next to it that way. Choose the file instead, or open the GitHub Pages address.</p>' : '<p>Check that the file is uploaded to the repository root with exactly that name. GitHub Pages can take a minute to publish a change.</p>'}
    <div class="btn-row"><button class="btn primary" data-act="pick-words">Choose CSV or JSON file</button><button class="btn" data-act="reload-words">Try again</button></div></div>`;
}

/* ---------- Rendering: words ---------- */
const W = {q:'', tier:'all', open:null};
function renderWords(){
  const el = $('#v-words');
  if (!WORDS.length){ el.innerHTML = loadErrorHTML(); return; }
  const counts = {all:WORDS.length, new:WORDS.filter(isNew).length};
  TIER_IDS.forEach(t => counts[t] = WORDS.filter(w => !isNew(w) && tierOf(w) === t).length);
  const q = W.q.trim().toLowerCase();
  const list = WORDS.filter(w => {
    if (W.tier === 'new' && !isNew(w)) return false;
    if (W.tier !== 'all' && W.tier !== 'new' && (isNew(w) || tierOf(w) !== W.tier)) return false;
    if (!q) return true;
    return [w.german, w.artikel, w.english, w.turkish, w.tags, w.example_de].join(' ').toLowerCase().includes(q);
  });
  const chip = (id, label) => counts[id] || id === 'all' ? `<button data-wt="${id}" aria-pressed="${W.tier===id}">${esc(label)} ${counts[id]}</button>` : '';
  el.innerHTML = `
    <div class="list-tools"><input type="search" id="w-q" placeholder="Search German, English, Turkish or tags" value="${esc(W.q)}" aria-label="Search words"></div>
    <div class="tier-chips">${chip('all','All')}${chip('new','Not started')}${TIERS.map(t => chip(t.id, t.label)).join('')}</div>
    <div class="wlist">${list.length ? list.map(rowHTML).join('') : '<div class="wrow-detail" style="padding:16px">No words match.</div>'}</div>`;
}
function rowHTML(w){
  const p = prog(w), open = W.open === w.key, a = w.artikel.split('/')[0];
  const opts = TIERS.map(t => `<option value="${t.id}" ${tierOf(w)===t.id?'selected':''}>${esc(t.label)}</option>`).join('');
  return `<div class="wrow" data-key="${esc(w.key)}">
    <div class="wrow-main">
      <button class="de" data-act="row" aria-expanded="${open}">${w.artikel ? `<span class="a ${esc(a)}">${esc(w.artikel)}</span>` : ''}${esc(w.german)}</button>
      <div class="mean"><span>${esc(w.english)}</span><span lang="tr">${esc(w.turkish)}</span></div>
      <div class="ctl"><select class="sm" data-act="row-tier" aria-label="Repetition for ${esc(w.german)}">${opts}</select>
        <span class="due">${p ? esc(dueText(p.due)) : 'not started'}</span></div>
    </div>
    ${open ? `<div class="wrow-detail">
      ${w.example_de ? `<div class="de-ex" lang="de">${esc(w.example_de)}</div>` : ''}
      ${w.example_en ? `<div>${esc(w.example_en)}</div>` : ''}${w.example_tr ? `<div lang="tr">${esc(w.example_tr)}</div>` : ''}
      <div style="margin-top:6px">${pluralLine(w)}</div>
      <div style="margin-top:6px;font-size:13.5px;color:var(--ink-3)">Added ${esc(w.date || '—')}${p ? `, reviewed ${p.reps} time${p.reps===1?'':'s'}, forgotten ${p.lapses}` : ''}${store.amap[w.key] ? `, artikel guessed right ${store.amap[w.key].ok} of ${store.amap[w.key].ok + store.amap[w.key].miss}` : ''}</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn" data-act="row-now">Review today</button><button class="btn" data-act="row-speak">Listen</button></div>
    </div>` : ''}
  </div>`;
}

/* ---------- Rendering: stats ---------- */
function streak(){
  let n = 0, d = today();
  if (!store.log[d]) d = addDays(d, -1);
  while (store.log[d]){ n++; d = addDays(d, -1); }
  return n;
}
function renderStats(){
  const el = $('#v-stats');
  if (!WORDS.length){ el.innerHTML = loadErrorHTML(); return; }
  const counts = Object.fromEntries(TIER_IDS.map(t => [t, 0])); let notStarted = 0;
  WORDS.forEach(w => { if (isNew(w)) notStarted++; else counts[tierOf(w)]++; });
  const max = Math.max(1, ...Object.values(counts));
  const totalReviews = Object.values(store.log).reduce((a, b) => a + b, 0);
  const solid = WORDS.filter(w => !isNew(w) && ['biweekly','monthly','quarterly','retired'].includes(tierOf(w))).length;
  // heatmap: 20 weeks ending this week (Mon-start)
  const t = today(), now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const start = addDays(t, -(19*7 + dow));
  let cells = '';
  for (let i = 0; i < 140; i++){
    const d = addDays(start, i); const c = store.log[d] || 0;
    const future = d > t;
    const l = future ? 'future' : c === 0 ? '' : c < 6 ? 'l1' : c < 16 ? 'l2' : c < 31 ? 'l3' : 'l4';
    cells += `<i class="${l}" title="${d}: ${c} review${c===1?'':'s'}"></i>`;
  }
  const A = store.artikel, at = A.ok + A.miss;
  const tricky = WORDS.filter(w => (store.amap[w.key] || {}).miss > 0)
    .sort((a, b) => store.amap[b.key].miss - store.amap[a.key].miss).slice(0, 6);
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><b>${WORDS.length}</b><span>words in the list</span></div>
      <div class="stat"><b>${solid}</b><span>at 2 weeks or longer</span></div>
      <div class="stat"><b>${streak()}</b><span>day streak</span></div>
      <div class="stat"><b>${store.log[t] || 0}</b><span>reviewed today</span></div>
    </div>
    <div class="panel"><h3>Leitner box</h3><p class="sub">Where each word sits. ${notStarted ? `${notStarted} not started yet.` : 'Every word has been started.'}</p>
      <div class="boxes">${TIERS.map(x => `<div class="box"><span class="cnt">${counts[x.id]}</span><div class="fill" style="height:${Math.round(counts[x.id]/max*110)}px"></div><span class="lab">${esc(TIER_TAB[x.id])}</span></div>`).join('')}</div></div>
    <div class="panel"><h3>Review days</h3><p class="sub">Last 20 weeks, ${totalReviews} reviews in total.</p>
      <div class="heat" aria-label="Review activity heatmap">${cells}</div>
      <div class="legend">Fewer <i style="background:var(--desk-2)"></i><i class="l1" style="background:color-mix(in srgb,var(--das) 30%,var(--desk-2))"></i><i style="background:color-mix(in srgb,var(--das) 55%,var(--desk-2))"></i><i style="background:color-mix(in srgb,var(--das) 78%,var(--desk-2))"></i><i style="background:var(--das)"></i> More</div></div>
    <div class="panel"><h3>Artikel guesses</h3><p class="sub">From the der/die/das buttons.</p>
      <div class="art-acc"><div><b>${at ? Math.round(A.ok/at*100) + '%' : '—'}</b><span>correct</span></div><div><b>${A.ok}</b><span>right</span></div><div><b>${A.miss}</b><span>wrong</span></div></div>
      ${tricky.length ? `<p class="sub" style="margin:14px 0 4px">Most missed</p><div>${tricky.map(w => `<span class="chip" style="margin:0 6px 6px 0;display:inline-block"><span class="a ${esc(w.artikel.split('/')[0])}" style="font-weight:700">${esc(w.artikel)}</span> ${esc(w.german)}</span>`).join('')}</div>` : ''}
    </div>`;
}

      <div class="interval-grid">${ACTIVE.map(t => `<label>${esc(TIER_NAME[t])}<input type="number" min="1" max="999" data-ivl="${t}" value="${ivl(t)}" aria-label="${esc(TIER_NAME[t])} interval in days"></label>`).join('')}</div>

      ${SOURCE.skipped ? `<br>${SOURCE.skipped} row${SOURCE.skipped>1?'s':''} skipped because the german column was empty.` : ''}
      ${SOURCE.dupes ? `<br>${SOURCE.dupes} duplicate row${SOURCE.dupes>1?'s':''} ignored (same word and artikel).` : ''}</p>
      <div class="set-row"><label for="s-src">Read first<span class="hint">The other file is used if this one is missing.</span></label>
        <select id="s-src"><option value="csv" ${s.source==='csv'?'selected':''}>Wörter.csv</option><option value="json" ${s.source==='json'?'selected':''}>Wörter.json</option></select></div>
      <div class="btn-row"><button class="btn" data-act="reload-words">Reload from GitHub</button><button class="btn" data-act="pick-words">Open a local file</button></div></div>
    <div class="panel"><h3>Progress</h3><p class="sub">Progress lives in this browser. Back it up to move it to your phone or another computer.</p>
      <div class="btn-row"><button class="btn primary" data-act="export">Back up progress</button><button class="btn" data-act="import">Restore from backup</button><button class="btn danger" data-act="reset">Reset all progress</button></div></div>`;

/* ---------- App shell ---------- */
function applyTheme(){
  const t = store.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function updateBadge(){
  const n = WORDS.length ? dueWords().length + Math.min(newLeft(), newWords().length) : 0;
  const b = $('#due-badge'); b.textContent = n; b.hidden = !n;
  $('#meta').textContent = WORDS.length ? `${WORDS.length} words, ${n} due today` : 'No word list loaded';
  $('#foot-src').textContent = SOURCE.name ? SOURCE.name + (SOURCE.cached ? ' (saved copy)' : '') : '—';
}
function show(view){
  S.view = view;
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === view));
  ['review','words','stats','settings'].forEach(v => $('#v-' + v).hidden = v !== view);
  render();
}
function render(){
  updateBadge();
  ({review:renderReview, words:renderWords, stats:renderStats, settings:renderSettings})[S.view]();
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('nav.tabs button'); if (tab){ show(tab.dataset.view); return; }
  const mb = e.target.closest('[data-mode]');
  if (mb){ S.mode = mb.dataset.mode; startSession(); if (S.view !== 'review') show('review'); else renderReview(); return; }
  const wt = e.target.closest('[data-wt]'); if (wt){ W.tier = wt.dataset.wt; renderWords(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, row = b.closest('.wrow'), rw = row ? BYKEY.get(row.dataset.key) : null;
  switch (act){
    case 'reveal': reveal(); break;
    case 'art': revealArt(null); break;
    case 'art-reveal': S.revealed = true; revealArt(null); break;
    case 'guess': revealArt(b.dataset.a); break;
    case 'grade': grade(b.dataset.g); break;
    case 'next': advance(); break;
    case 'tier': moveTo(b.dataset.t); break;
    case 'speak': if (cur()) speak((cur().artikel ? cur().artikel.split('/')[0] + ' ' : '') + cur().german); break;
    case 'restart': startSession(); renderReview(); break;
    case 'row': W.open = W.open === rw.key ? null : rw.key; renderWords(); break;
    case 'row-now': { const p = ensure(rw); if (p.tier === 'retired') p.tier = 'daily'; p.due = today(); save(); toast(`${rw.german} added to today's reviews.`); startSessionIfIdle(); renderWords(); updateBadge(); break; }
    case 'row-speak': speak((rw.artikel ? rw.artikel.split('/')[0] + ' ' : '') + rw.german); break;
    case 'pick-words': $('#file-words').click(); break;
    case 'reload-words': reloadWords(); break;
    case 'export': {
      const data = {app:'woerter', version:2, exported:new Date().toISOString(), ...store};
      download(`woerter-progress-${today()}.json`, JSON.stringify(data, null, 2), 'application/json'); toast('Backup downloaded.'); break;
    }
    case 'import': $('#file-progress').click(); break;
    case 'reset':
      if (confirm('Reset all review progress in this browser? Your word list is not affected.')){
        const settings = store.settings; store = freshStore(); store.settings = settings; save(); startSession(); render(); toast('Progress reset.');
      }
      break;
  }
});
function startSessionIfIdle(){ if (!cur()) startSession(); }
document.addEventListener('change', e => {
  const t = e.target, s = store.settings;
  if (t.id === 'f-level'){ S.level = t.value; startSession(); renderReview(); return; }
  if (t.id === 'f-tag'){ S.tag = t.value; startSession(); renderReview(); return; }
  if (t.dataset.act === 'row-tier'){
    const w = BYKEY.get(t.closest('.wrow').dataset.key); const p = ensure(w);
    setTier(p, t.value); save(); toast(t.value === 'retired' ? `${w.german} retired.` : `${w.german}: ${TIER_NAME[t.value].toLowerCase()}, next review ${inWords(ivl(t.value))}.`);
    renderWords(); updateBadge(); return;
  }
  if (t.dataset.ivl){ const v = Math.max(1, Math.min(999, parseInt(t.value, 10) || DEFAULTS.intervals[t.dataset.ivl])); s.intervals[t.dataset.ivl] = v; t.value = v; save(); toast(`${TIER_NAME[t.dataset.ivl]} now waits ${v} day${v>1?'s':''}.`); return; }
  if (t.id === 's-forget'){ s.onForget = t.value; }
  else if (t.id === 's-relearn'){ s.relearn = t.checked; }
  else if (t.id === 's-retire'){ s.autoRetire = t.checked; }
  else if (t.id === 's-new'){ s.newPerDay = Math.max(0, parseInt(t.value, 10) || 0); startSession(); }
  else if (t.id === 's-dir'){ s.direction = t.value; resetCard(); }
  else if (t.id === 's-exfront'){ s.exampleFront = t.checked; }
  else if (t.id === 's-theme'){ s.theme = t.value; applyTheme(); }
  else if (t.id === 's-src'){ s.source = t.value; save(); reloadWords(); return; }
  else return;
  save(); updateBadge(); toast('Saved.');
});
document.addEventListener('input', e => {
  if (e.target.id === 'w-q'){ W.q = e.target.value; const pos = e.target.selectionStart; renderWords(); const i = $('#w-q'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'review' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if ((k === ' ' || k === 'enter') && !e.target.closest('button')){
    e.preventDefault();
    if (S.mode === 'artikel'){ if (S.art) advance(); else { S.revealed = true; revealArt(null); } }
    else if (!S.revealed) reveal();
    return;
  }
  if (k === 'a') revealArt(null);
  else if (k === 'j') revealArt('der');
  else if (k === 'k') revealArt('die');
  else if (k === 'l') revealArt('das');
  else if (k === 's' && cur()) speak((cur().artikel ? cur().artikel.split('/')[0] + ' ' : '') + cur().german);
  else if (S.revealed && S.mode !== 'artikel' && ['1','2','3'].includes(k)) grade({'1':'forgot','2':'hard','3':'good'}[k]);
});
$('#file-words').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const text = await f.text(); const kind = /\.json$/i.test(f.name) ? 'json' : 'csv';
  try {
    ingest(text, kind, f.name, false);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({text, kind, name:f.name})); } catch(err) {}
    startSession(); render(); toast(`Loaded ${WORDS.length} words from ${f.name}.`);
  } catch(err){ toast(err.message); }
  e.target.value = '';
});
$('#file-progress').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !d.progress) throw new Error('That file is not a Wörter progress backup.');
    store = {progress:d.progress, log:d.log || {}, amap:d.amap || {}, newToday:d.newToday || {date:'',count:0}, artikel:d.artikel || {ok:0,miss:0},
             settings:Object.assign(freshStore().settings, d.settings || {})};
    store.settings.intervals = Object.assign({}, DEFAULTS.intervals, (d.settings || {}).intervals || {});
    save(); applyTheme(); syncFileTiers(); startSession(); render(); toast('Progress restored.');
  } catch(err){ toast(err.message); }
  e.target.value = '';
});
async function reloadWords(){
  const ok = await loadWords();
  startSession(); render();
  toast(ok ? `Loaded ${WORDS.length} words from ${SOURCE.name}.` : 'No word list found.');
}

/* ---------- Boot ---------- */
applyTheme();
loadWords().then(() => { startSession(); render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.view === 'review' && !cur()){ startSession(); render(); } });
})();
</script>
</body>
